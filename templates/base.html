<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Video Grader{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true">V</span><span>VIDEO GRADER</span></a>
        <nav class="site-nav" aria-label="Main navigation">
            {% if session.get('user_id') %}
                <a href="{{ url_for('overall') }}">My Reviews</a>
                <a class="nav-action" href="{{ url_for('upload_page') }}">New review <span aria-hidden="true">&#43;</span></a>
                <span class="user-pill">{{ session.get('username') }}</span>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% else %}
                <a href="{{ url_for('login_page') }}">Login</a>
                <a href="{{ url_for('register_page') }}">Register</a>
            {% endif %}
        </nav>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer"><span>VIDEO GRADER</span><span>Presentation review workspace</span></footer>
    <script src="{{ url_for('static', filename='js/upload.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
