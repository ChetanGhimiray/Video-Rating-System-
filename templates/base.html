<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Presentation Review{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true">V</span><span>VOICE / FRAME</span></a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="{{ url_for('overall') }}">Reviews</a>
            <a class="nav-action" href="{{ url_for('upload_page') }}">New review <span aria-hidden="true">&#43;</span></a>
        </nav>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer"><span>VOICE / FRAME</span><span>Presentation review workspace</span></footer>
    <script src="{{ url_for('static', filename='js/upload.js') }}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
