{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="auth-card">
    <p class="eyebrow">CREATE ACCOUNT</p>
    <h1>Register</h1>
    {% if error %}
        <div class="form-error">{{ error }}</div>
    {% endif %}
    <form method="post">
        <label>
            Username
            <input class="text-input" type="text" name="username" required>
        </label>
        <label>
            Password
            <input class="text-input" type="password" name="password" required>
        </label>
        <button class="button button-primary" type="submit">Create account</button>
    </form>
    <p class="mini-link">Already have an account? <a class="text-link" href="{{ url_for('login_page') }}">Login here</a></p>
</section>
{% endblock %}
