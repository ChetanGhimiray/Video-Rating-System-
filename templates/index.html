<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Rating System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }
        .container {
            max-width: 700px;
            margin: 80px auto;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }
        h1 {
            margin-top: 0;
            text-align: center;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: 600;
        }
        input,
        select {
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }
        .or {
            text-align: center;
            font-weight: 700;
            color: #6b7280;
        }
        button {
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Rating System</h1>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/upload" method="post" enctype="multipart/form-data">
            <label>
                Upload a video
                <input type="file" name="video" accept=".mp4,.mov,.avi,.mkv,.webm">
            </label>

            <div class="or">OR</div>

            <label>
                Video URL
                <input type="url" name="video_url" placeholder="https://example.com/video.mp4">
            </label>

            <label>
                Speaking style
                <select name="speaking_style" required>
                    {% for value, style in speaking_styles.items() %}
                        <option value="{{ value }}" {% if value == 'conversational' %}selected{% endif %}>{{ style.label }}</option>
                    {% endfor %}
                </select>
            </label>

            <button type="submit">Analyze Video</button>
        </form>
    </div>
</body>
</html>
